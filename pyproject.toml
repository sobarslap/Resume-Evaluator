[project]
name = "resume-evaluator"
version = "0.1.0"
description = "A Streamlit web app that ranks resumes against a job description using Groq LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "groq>=0.13",
    "pydantic>=2.9",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evaluator"]
